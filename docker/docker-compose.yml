version: "3.8"

services:
  postgis:
    image: postgis/postgis:15-3.3-alpine
    container_name: amip-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: amip
      POSTGRES_USER: amip_user
      POSTGRES_PASSWORD: amip_password
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./postgis-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amip_user -d amip"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: amip-backend
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - MOCK_MODE=true
      - DATABASE_URL=postgresql+asyncpg://amip_user:amip_password@postgis:5432/amip
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ../packages:/app/packages
      - ../apps:/app/apps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgis_data:

